name: Deploy Web Preview to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'web-preview/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-preview/package-lock.json

      - name: Install dependencies
        run: |
          cd web-preview
          npm ci

      - name: Build
        run: |
          cd web-preview
          npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: web-preview/dist
          branch: gh-pages
